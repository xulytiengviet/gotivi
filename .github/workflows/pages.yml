name: GoTiVi Rust Conformance and WASM Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gotivi-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Rust golden and transactional conformance
        run: cargo test --all-targets
      - name: Build native core and CLI
        run: cargo build --release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python C ABI
        run: |
          python -m pip install -r python/requirements.txt
          python - <<'PY'
          from python.app import type_text, TypeRequest
          tests = [
              ('Tieengs Vieejt', 'telex', 'Tiếng Việt'),
              ('thuowng', 'telex', 'thương'),
              ('mixx', 'telex', 'mix'),
              ('tie6ng1', 'vni', 'tiếng'),
          ]
          for raw, mode, expected in tests:
              value = type_text(TypeRequest(text=raw, mode=mode)).get('output')
              assert value == expected, (raw, value, expected)
          print('Python/C ABI smoke: PASS')
          PY
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build WebAssembly
        run: wasm-pack build --target web --out-dir docs/pkg --features wasm
      - name: Verify browser bundle
        run: test -s docs/pkg/gotivi.js && test -s docs/pkg/gotivi_bg.wasm
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
